<style>

#fab{position:fixed;right:20px;bottom:24px;z-index:30;border-radius:99px;padding:14px 18px;box-shadow:0 6px 20px #0004}

.msg{margin:6px 0;padding:8px 12px;border-radius:12px;background:var(--bd)}.msg.u{background:var(--pr);color:var(--on);margin-left:30px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#192338;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;display:none}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.login{max-width:760px;margin:8vh auto;padding:0 18px;text-align:center}.login .logo{font-size:56px;color:var(--pr)}
.rl{cursor:pointer;text-align:left}.rl:hover{border-color:var(--pr)}
@media(max-width:800px){#app{display:block}aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}.logo,.me{display:none}aside nav{flex-direction:row;flex:1}aside button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px;justify-content:center;text-align:center}main{padding:16px 14px 100px}h1{font-size:30px}.gm{grid-template-columns:1fr}#fab{bottom:84px}#chat{bottom:140px}}
</style></head><body>
<div id="app"></div><div id="md"></div><div id="chat" style="display:none"></div><div id="toast"></div>
<button class="btn" id="fab" style="display:none" onclick="tc()">✦ ИИ-ассистент</button>
<script>
const $=s=>document.querySelector(s),sum=(a,k)=>a.reduce((x,p)=>x+p[k],0);
const fm=n=>(n/1000).toFixed(1).replace('.',',')+' млн ₸',ft=n=>Math.round(n)+' тыс ₸',pc=n=>(n>0?'+':'')+Math.round(n*100)+'%';
const MO=["Июн","Июл","Авг","Сен","Окт","Ноя"],FR={ok:"установлен",none:"нет ларя",idle:"есть, продаж нет"};
const RG=[["Алматы",43.5,76.89],["Астана",51.17,71.43],["Шымкент",42.4,69.59],["Караганда",49.8,73.1],["Актобе",50.28,57.2],["Атырау",47.1,51.9],["Павлодар",52.28,76.97],["Костанай",53.2,63.6]];
const RP=[["Ерлан К.",0],["Мадина Б.",0],["Асель Н.",1],["Тимур Ж.",1],["Бауыржан О.",2],["Динара М.",3],["Данияр С.",4],["Айгерим Т.",5],["Серик А.",6],["Лаура Е.",7]].map(([n,r],i)=>({n,r,i}));
let sd=11;const rn=()=>(sd=sd*16807%2147483647)/2147483647;
RP.forEach(x=>x.ph=75+Math.round(rn()*20));
const NM=["Алем","Береке","Нур","Достык","Мерей","Арман"],P=[];
RG.forEach((g,r)=>{const rs=RP.filter(x=>x.r==r);for(let i=0;i<6;i++){const rp=rs[i%rs.length],prev=Math.round(400+rn()*500),pl=Math.round(prev*1.08);let cur=Math.round(prev*(.9+rn()*.3));
if(rp.n=="Данияр С.")cur=Math.round(prev*.7);if(rp.n=="Айгерим Т.")cur=Math.round(pl*.5);
P.push({id:P.length,n:`Магазин «${NM[i]}» №${P.length+1}`,r,lat:g[1]+(rn()-.5)*1.2,lng:g[2]+(rn()-.5)*1.6,rp:rp.i,prev,pl,cur,fr:'ok',vis:Math.round(rn()*6)+1})}});
P.filter(p=>p.r==6).slice(0,5).forEach(p=>p.vis=21);P.find(p=>p.r==7).fr='none';
const ip=P.filter(p=>p.r==2)[1];ip.fr='idle';ip.cur=0;
const CS={miss:["Торгпред не бывает в точке: нет check-in по маршруту","Сбой маршрута или транспорта","Точка закрыта или сменила владельца"],drop:["Продукция конкурента на полке","Нет заказа или поставки","Упал трафик в точке"],nofr:["Ларь не установлен или вывезен","Ларь не внесён в реестр","Точка отказалась от оборудования"],idle:["Ларь пуст или неисправен","Ларь занят чужим товаром","Не было поставки"]};
const TT={miss:"Не посещена",drop:"Падение продаж",nofr:"Нет ларя",idle:"Ларь без продаж"},LV=["","Супервайзер","Директор","Гендиректор"];
const pb=p=>{const a=[];if(p.vis>14)a.push('miss');if(p.cur<p.prev*.9&&p.fr!='idle')a.push('drop');if(p.fr=='none')a.push('nofr');if(p.fr=='idle')a.push('idle');return a};
const col=p=>{const d=p.cur/p.prev-1;return d<-.1?'var(--rd)':d>=0?'var(--gn)':'var(--am)'};
const rs=i=>{const q=P.filter(p=>p.rp==i),f=sum(q,'cur'),pl=sum(q,'pl'),vis=Math.round(100*q.filter(p=>p.vis<=14).length/q.length),pp=Math.round(100*f/pl),kpi=Math.round(Math.min(pp,120)*.5+vis*.3+RP[i].ph*.2);return{f,pl,vis,pp,ph:RP[i].ph,kpi,b:kpi>=70?kpi*3000:0}};
const iss=q=>{const a=[];q.forEach(p=>pb(p).forEach(t=>a.push({k:p.id+t,p,t,w:t=='nofr'?1:t=='drop'&&p.cur/p.prev<.75?3:2})));return a.sort((x,y)=>y.w-x.w)};
const rg=q=>RG.map((g,i)=>{const a=q.filter(p=>p.r==i);return a.length?{l:g[0],v:sum(a,'cur')/sum(a,'prev')-1}:null}).filter(Boolean);
const NV=[['ov','Обзор','📊'],['map','Карта','🗺'],['st','Сотрудники','👥'],['al','Сигналы','🔔']];
const ROLES={ceo:{n:'Гендиректор',u:'Асхат Нурланов',nav:NV,dl:1},sd:{n:'Директор продаж',u:'Гульнара Ахметова',nav:NV,dl:1},rd:{n:'Региональный директор',u:'Марат Сейтов',nav:[NV[0],NV[1],NV[2],['ph','Фото','📷']],reg:0,dl:1},rep:{n:'Торгпред',u:'Ерлан К.',nav:[['rt','Маршрут','🚚'],['pl','План','🎯'],['rk','Рейтинг','🏆']],reg:0}};
const PH=P.slice(0,6).map((p,i)=>({p:p.id,t:`19.11 ${9+i}:${10+i*7}`,st:'new'}));
let S={role:null,tab:null,reg:-1,sel:null,res:{},ci:{},ph:{},per:1,chat:[]};
const role=()=>ROLES[S.role];
const pts=()=>P.filter(p=>(role().reg==null||p.r==role().reg)&&(S.reg<0||p.r==S.reg));
const scope=()=>role().reg!=null?RG[role().reg][0]:S.reg>=0&&S.tab=='map'?RG[S.reg][0]:'вся страна';
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)};
const line=v=>{const mx=Math.max(...v),mn=Math.min(...v)*.9,pt=v.map((y,i)=>[30+i*108,170-(y-mn)/(mx-mn||1)*140]);return `<svg viewBox="0 0 600 200" width="100%"><polyline fill="none" stroke="var(--pr)" stroke-width="3" points="${pt.map(a=>a.join(',')).join(' ')}"/>${pt.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="5" fill="var(--pr)"/><text x="${a[0]}" y="194" text-anchor="middle" font-size="12" fill="var(--mu)">${MO[i]}</text>`).join('')}</svg>`};
const bars=a=>{const m=Math.max(...a.map(x=>Math.abs(x.v)),.01);return a.map(x=>`<div class="br"><span>${x.l}</span><i><b style="width:${Math.abs(x.v)/m*100}%;background:${x.v<0?'var(--rd)':'var(--gn)'}"></b></i><em>${pc(x.v)}</em></div>`).join('')};
const kp=(l,v)=>`<div class="cd k"><small>${l}</small><b>${v}</b></div>`;
const OUT=[[47,51.5],[50.5,51.6],[51.5,53],[55,50.7],[61,50.8],[61.5,53.2],[65,54.5],[69,55.3],[73,54.2],[76,54.1],[79,52.2],[83,51.1],[87.3,49.1],[85.5,47],[83,47.2],[80,45],[80.3,42.8],[75,42.9],[73.5,42.5],[70.5,42.2],[69.5,41],[66,42.1],[61,44.2],[56,45],[55.5,41.3],[53,42],[52.8,44.5],[51,44.7],[51.8,46.5],[49,46.4],[48,47.8],[46.5,48.3],[47,49.8]];
const X=l=>(l-46)*22.17,Y=a=>(55.8-a)*33.3;
function login(){return `<div class="login"><div class="logo">Milkontrol</div><p class="mu">DairyMilk · контроль торговой команды. Выберите роль для входа в демо.</p><div class="g g2" style="margin-top:28px">${Object.entries(ROLES).map(([k,r])=>`<div class="cd rl" onclick="inn('${k}')"><h3>${r.n}</h3><span class="mu">${r.u}</span></div>`).join('')}</div></div>`}
function inn(k){S.role=k;S.tab=null;S.reg=-1;S.sel=null;$('#fab').style.display='block';R()}
function out(){S.role=null;$('#fab').style.display='none';$('#chat').style.display='none';R()}
function go(t,id){S.tab=t;if(id!=null)S.sel=id;R();scrollTo(0,0)}
function R(){const a=$('#app');if(!S.role){a.innerHTML=login();return}const r=role();if(!S.tab)S.tab=r.nav[0][0];
const T={ov,map:mpv,st,al,ph:phv,rt,pl,rk},nv=r.nav.find(n=>n[0]==S.tab);
a.innerHTML=`<aside><div class="logo">Milkontrol</div><nav>${r.nav.map(n=>`<button class="${n[0]==S.tab?'on':''}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1]}</button>`).join('')}</nav><div class="me">${r.n}<br>${r.u}</div></aside><main><div class="top"><div><h1>${nv[1]}</h1><p class="mu" style="margin:4px 0 0">DairyMilk · ${scope()}</p></div><div>${r.dl?'<button class="btn" onclick="rpm()">⬇ Скачать отчёт</button>':''}<button class="btn o" onclick="out()">Выйти</button></div></div>${T[S.tab]()}</main>`}
function ov(){const q=pts(),f=sum(q,'cur'),pv=sum(q,'prev'),pl=sum(q,'pl'),cv=Math.round(100*q.filter(p=>p.vis<=14).length/q.length),wf=Math.round(100*q.filter(p=>p.fr!='none').length/q.length),id=q.filter(p=>p.fr=='idle').length,r=rg(q).sort((a,b)=>b.v-a.v),is=iss(q).slice(0,6);
const sr=[.82,.88,.93,.97,1,f/pv].map(x=>x*pv);
return `<div class="g g3">${kp('Продажи / план',fm(f)+' / '+fm(pl))}${kp('Выполнение плана',Math.round(100*f/pl)+'%')}${kp('К прошлому периоду',pc(f/pv-1))}${kp('Охват визитами',cv+'%')}${kp('Точек с ларём',wf+'%')}${kp('Ларей без продаж',id)}</div>
<div class="g g2" style="margin-top:14px"><div class="cd"><h3>Динамика продаж</h3>${line(sr)}</div><div class="cd"><h3>Регионы: изменение продаж</h3>${bars(r)}</div></div>
<div class="g g2" style="margin-top:14px"><div class="cd"><h3>Растут</h3>${bars(r.filter(x=>x.v>=0).slice(0,3))||'—'}<h3 style="margin-top:14px">Падают</h3>${bars(r.slice(-3).reverse().filter(x=>x.v<0))||'—'}</div>
<div class="cd"><h3>Критичные проблемы</h3>${is.map(i=>`<div class="row" onclick="go('map',${i.p.id})"><span class="dot" style="background:var(--rd)"></span><div style="flex:1"><b>${TT[i.t]}</b> · ${i.p.n}<br><span class="mu">${RG[i.p.r][0]}</span></div><span class="tag">${LV[i.w]}</span></div>`).join('')}</div></div>`}
function card(p){if(!p)return `<div class="cd mu">Нажмите на точку на карте, чтобы увидеть карточку.</div>`;const pr=pb(p),m=Math.max(p.cur,p.prev,1);
return `<div class="cd"><h3>${p.n}</h3><p class="mu" style="margin:0">${RG[p.r][0]} · ${RP[p.rp].n}</p><div class="g g3" style="margin:12px 0"><div class="k"><small>Продажи</small><b>${Math.round(p.cur)}</b> тыс</div><div class="k"><small>К прошлому</small><b style="color:${col(p)}">${pc(p.cur/p.prev-1)}</b></div></div>
<div class="br"><span>Прошлый</span><i><b style="width:${p.prev/m*100}%;background:var(--ac,#8FB3E2)"></b></i></div><div class="br"><span>Сейчас</span><i><b style="width:${p.cur/m*100}%;background:${col(p)}"></b></i></div>
<p>Ларь: <b>${FR[p.fr]}</b><br>Последний визит: <b>${p.vis} дн. назад</b></p><h4>Проблемы и возможные причины</h4>${pr.length?pr.map(t=>`<div class="pb"><b>${TT[t]}</b><ul>${CS[t].map(c=>`<li>${c}</li>`).join('')}</ul></div>`).join(''):'<p class="gn">Проблем нет</p>'}</div>`}
function mpv(){const q=pts(),rl=role().reg==null;
return `${rl?`<div><span class="chip ${S.reg<0?'on':''}" onclick="S.reg=-1;R()">Все регионы</span>${RG.map((g,i)=>`<span class="chip ${S.reg==i?'on':''}" onclick="S.reg=${i};R()">${g[0]}</span>`).join('')}</div>`:''}
<div class="g gm"><div class="cd"><svg viewBox="0 0 920 500" class="map"><polygon points="${OUT.map(a=>X(a[0]).toFixed(0)+','+Y(a[1]).toFixed(0)).join(' ')}" fill="var(--cd)" stroke="var(--pr)" stroke-width="2"/>${RG.filter((g,i)=>q.some(p=>p.r==i)).map(g=>`<text x="${X(g[2])}" y="${Y(g[1])-24}" text-anchor="middle" font-size="15" fill="var(--mu)">${g[0]}</text>`).join('')}${q.map(p=>`<g onclick="S.sel=${p.id};R()" style="cursor:pointer">${p.fr!='ok'?`<circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="15" fill="none" stroke="var(--tx)" stroke-dasharray="3 3"/>`:''}<circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="${S.sel==p.id?12:9}" fill="${col(p)}" stroke="#fff" stroke-width="2"/></g>`).join('')}</svg>
<p class="mu" style="margin:8px 0 0"><span class="dot" style="display:inline-block;background:var(--rd)"></span> падение &gt;10% &nbsp;<span class="dot" style="display:inline-block;background:var(--am)"></span> −10…0% &nbsp;<span class="dot" style="display:inline-block;background:var(--gn)"></span> рост &nbsp;◌ проблема с ларём</p></div>${card(P[S.sel])}</div>`}
function st(){const l=RP.filter(x=>role().reg==null||x.r==role().reg).map(x=>({x,s:rs(x.i)})).sort((a,b)=>b.s.kpi-a.s.kpi);
return `<div class="cd tw"><table><tr><th>Торгпред</th><th>Регион</th><th>План</th><th>Визиты</th><th>Фото</th><th>KPI</th><th>Премия</th></tr>${l.map(({x,s})=>`<tr><td><b>${x.n}</b></td><td>${RG[x.r][0]}</td><td><div class="br" style="margin:0"><i style="min-width:70px"><b style="width:${Math.min(s.pp,100)}%;background:${s.pp<70?'var(--rd)':'var(--gn)'}"></b></i><em>${s.pp}%</em></div></td><td>${s.vis}%</td><td>${s.ph}%</td><td><b>${s.kpi}</b></td><td>${s.b?s.b.toLocaleString('ru')+' ₸':'—'}</td></tr>`).join('')}</table></div><p class="mu">KPI = 50% выполнение плана + 30% визиты + 20% дисциплина фото. Премия = KPI × 3 000 ₸ при KPI от 70.</p>`}
function al(){const q=pts(),a=iss(q).map(i=>({...i,txt:TT[i.t]+' · '+i.p.n,sub:RG[i.p.r][0]+' · '+RP[i.p.rp].n,c:CS[i.t]}));
RP.filter(x=>role().reg==null||x.r==role().reg).forEach(x=>{const s=rs(x.i);if(s.pp<70)a.push({k:'pl'+x.i,w:3,txt:'План выполнен на '+s.pp+'% · '+x.n,sub:RG[x.r][0],c:["Низкий охват точек","Падение продаж по территории","Нужна встреча с торгпредом"]})});
a.sort((x,y)=>(S.res[x.k]?1:0)-(S.res[y.k]?1:0)||y.w-x.w);
return a.map(i=>`<div class="cd" style="margin-bottom:12px;opacity:${S.res[i.k]?.5:1}"><div style="display:flex;gap:10px;align-items:center"><span class="tag">${LV[i.w]}</span><div style="flex:1"><b>${i.txt}</b><br><span class="mu">${i.sub}</span></div><button class="btn o" onclick="S.res['${i.k}']=!S.res['${i.k}'];R()">${S.res[i.k]?'Вернуть':'Решено'}</button></div><div style="margin-top:8px">${i.c.map(c=>`<span class="chip" style="cursor:default">${c}</span>`).join('')}</div></div>`).join('')}
const shot=()=>`<svg viewBox="0 0 120 80" width="100%" style="border-radius:12px"><rect width="120" height="80" fill="#31487A"/><rect x="18" y="16" width="84" height="54" rx="5" fill="#D9E1F1"/><rect x="26" y="26" width="10" height="26" rx="2" fill="#fff"/><rect x="42" y="30" width="10" height="22" rx="2" fill="#8FB3E2"/><rect x="58" y="26" width="10" height="26" rx="2" fill="#fff"/><rect x="74" y="30" width="10" height="22" rx="2" fill="#8FB3E2"/></svg>`;
function phv(){const l=PH.filter(h=>P[h.p].r==role().reg);return `<div class="g g2">${l.map((h,i)=>`<div class="cd ph">${h.img?`<img src="${h.img}">`:shot()}<p style="margin:8px 0"><b>${P[h.p].n}</b><br><span class="mu">${RP[P[h.p].rp].n} · ${h.t} · GPS ✓</span></p>${h.st=='new'?`<button class="btn" onclick="PH[PH.indexOf(PH.filter(x=>P[x.p].r==role().reg)[${i}])].st='ok';R()">Принять</button> <button class="btn o" onclick="PH[PH.indexOf(PH.filter(x=>P[x.p].r==role().reg)[${i}])].st='no';R()">Отклонить</button>`:`<span class="tag">${h.st=='ok'?'Принято ✓':'Отклонено'}</span>`}</div>`).join('')}</div>`}
function rt(){return `<div class="g">${P.filter(p=>p.rp==0).map((p,i)=>`<div class="cd"><h3>${i+1}. ${p.n}</h3><p class="mu">Ларь: ${FR[p.fr]}</p>${S.ci[p.id]?`<p class="gn">✓ Check-in: ${S.ci[p.id]}</p>${S.ph[p.id]?'<p class="gn">✓ Фото отправлено на проверку</p>':`<button class="btn" onclick="cam(${p.id})">📷 Сделать фото</button>`}`:`<button class="btn" onclick="chk(${p.id})">📍 Check-in</button>`}</div>`).join('')}</div>`}
function chk(id){S.ci[id]='в радиусе '+(20+Math.round(Math.random()*40))+' м';R()}
async function cam(id){const m=$('#md');m.innerHTML=`<div class="mdl"><div class="bx"><b>Фото ларя и полки</b><video id="vd" autoplay playsinline muted></video><canvas id="cv" width="640" height="480" hidden></canvas><p class="mu" id="ct">Загрузка камеры…</p><button class="btn" id="sh">Снять</button><button class="btn o" onclick="$('#md').innerHTML=''">Закрыть</button></div></div>`;let ms=null;
try{ms=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#vd').srcObject=ms;$('#ct').textContent='Только камера: выбор из галереи отключён'}catch(e){$('#ct').textContent='Камера недоступна в этом окне: демо-кадр'}
$('#sh').onclick=()=>{const c=$('#cv'),x=c.getContext('2d'),v=$('#vd'),p=P[id];if(ms&&v.videoWidth)x.drawImage(v,0,0,640,480);else{x.fillStyle='#31487A';x.fillRect(0,0,640,480);x.fillStyle='#D9E1F1';x.fillRect(180,100,280,300)}
x.fillStyle='#000a';x.fillRect(0,440,640,40);x.fillStyle='#fff';x.font='16px sans-serif';x.fillText(`GPS ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)} · 19.11.2026 ${new Date().toTimeString().slice(0,5)}`,12,466);
PH.unshift({p:id,t:'19.11 '+new Date().toTimeString().slice(0,5),st:'new',img:c.toDataURL('image/jpeg',.6)});S.ph[id]=1;if(ms)ms.getTracks().forEach(t=>t.stop());$('#md').innerHTML='';toast('Фото отправлено на проверку');R()}}
function pl(){const s=rs(0),k=S.per,pf=s.pl*k,fc=Math.round(s.f*k*(k>1?1.04:1)),pp=Math.round(100*fc/pf);
return `<div style="margin-bottom:12px">${[[1,'Месяц'],[6,'6 месяцев'],[12,'Год']].map(a=>`<span class="chip ${k==a[0]?'on':''}" onclick="S.per=${a[0]};R()">${a[1]}</span>`).join('')}</div><div class="g g2"><div class="cd" style="text-align:center"><svg viewBox="0 0 120 120" width="180"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="${pp<70?'var(--rd)':'var(--gn)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${Math.min(pp,100)*3.14} 314" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" fill="var(--tx)" font-family="Cormorant Garamond">${pp}%</text></svg></div><div class="g">${kp('План на период',fm(pf))}${kp('Прогноз по текущему темпу',fm(fc))}${kp(fc>=pf?'Запас':'Не хватает',fm(Math.abs(pf-fc)))}</div></div>`}
function rk(){const l=RP.map(x=>({x,s:rs(x.i)})).sort((a,b)=>b.s.kpi-a.s.kpi),m=l.findIndex(a=>a.x.i==0),s=l[m].s,w=[['выполнение плана',s.pp],['визиты',s.vis],['фото-отчёты',s.ph]].sort((a,b)=>a[1]-b[1])[0];
return `<div class="g g3">${kp('Мой KPI',s.kpi)}${kp('Место среди торгпредов',(m+1)+' из '+l.length)}${kp('Прогноз премии',s.b.toLocaleString('ru')+' ₸')}</div><div class="cd" style="margin-top:14px"><h3>Что подтянуть</h3><p>Слабее всего: <b>${w[0]}</b> (${w[1]}%). Посещайте все точки маршрута, делайте фото ларя и полки в каждой.</p></div>`}
function rhtml(){const q=pts(),f=sum(q,'cur'),pv=sum(q,'prev'),pl=sum(q,'pl'),is=iss(q),r=rg(q).sort((a,b)=>b.v-a.v),pp=Math.round(100*f/pl);
return `<!doctype html><html lang="ru"><meta charset="utf-8"><title>Milkontrol отчёт</title><style>body{font:15px Georgia,serif;max-width:820px;margin:40px auto;color:#192338;padding:0 20px}h1{font-size:34px}h2{border-bottom:1px solid #8FB3E2;padding-bottom:4px;margin-top:28px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #D9E1F1;padding:6px;text-align:left}</style><h1>Milkontrol · отчёт DairyMilk</h1><p>Дата: 19.11.2026 · Охват: ${scope()}</p><h2>Ключевые метрики</h2><table><tr><td>Продажи факт</td><td>${fm(f)}</td></tr><tr><td>План</td><td>${fm(pl)} (${pp}%)</td></tr><tr><td>К прошлому периоду</td><td>${pc(f/pv-1)}</td></tr><tr><td>Проблемных сигналов</td><td>${is.length}</td></tr></table><h2>Регионы</h2><table>${r.map(x=>`<tr><td>${x.l}</td><td>${pc(x.v)}</td></tr>`).join('')}</table><h2>Проблемные точки и причины</h2><table>${is.map(i=>`<tr><td>${TT[i.t]}</td><td>${i.p.n}, ${RG[i.p.r][0]}</td><td>${CS[i.t][0]}</td></tr>`).join('')}</table><h2>Вывод ИИ</h2><p>Выполнение плана ${pp}%, динамика ${pc(f/pv-1)}. Лучший регион: ${r[0].l} (${pc(r[0].v)}), слабее всего: ${r[r.length-1].l} (${pc(r[r.length-1].v)}). Выявлено сигналов: ${is.length}.</p><h2>Рекомендации</h2><ul><li>Провести визиты супервайзера в точки с падением и пропусками.</li><li>Проверить и восстановить работу ларей без продаж.</li><li>Установить ларь в точках без оборудования.</li><li>Встретиться с торгпредами, выполняющими план ниже 70%.</li></ul></html>`}
function xl(){const q=pts(),wb=XLSX.utils.book_new(),A=(n,d)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),n);
A('Точки',q.map(p=>({"Точка":p.n,"Регион":RG[p.r][0],"Торгпред":RP[p.rp].n,"Продажи, тыс ₸":p.cur,"Прошлый период":p.prev,"Изменение %":Math.round((p.cur/p.prev-1)*100),"Ларь":FR[p.fr],"Дней с визита":p.vis})));
A('Сотрудники',RP.filter(x=>role().reg==null||x.r==role().reg).map(x=>{const s=rs(x.i);return{"Торгпред":x.n,"Регион":RG[x.r][0],"План %":s.pp,"Визиты %":s.vis,"Фото %":s.ph,"KPI":s.kpi,"Премия ₸":s.b}}));
A('Проблемы',iss(q).map(i=>({"Проблема":TT[i.t],"Точка":i.p.n,"Регион":RG[i.p.r][0],"Возможная причина":CS[i.t][0],"Уровень":LV[i.w]})));return XLSX.write(wb,{type:'array',bookType:'xlsx'})}
async function dlf(n,d){const u=window.claude&&await claude.use('downloads');if(!u){toast('Скачивание доступно при открытии в Claude');return}try{await u.save({filename:n,data:d});toast('Файл сохранён')}catch(e){if(e.code!='declined')toast('Не удалось сохранить файл')}}
function rpm(){const m=$('#md');m.innerHTML=`<div class="mdl"><div class="bx"><b>ИИ собирает отчёт…</b><div class="pg"><b id="pgb"></b></div><div id="pgr"></div></div></div>`;setTimeout(()=>$('#pgb').style.width='100%',50);
setTimeout(()=>{$('#pgr').innerHTML=`<p class="gn">Готово: метрики, графики, проблемные точки, причины и рекомендации.</p><button class="btn" style="width:100%;margin-bottom:8px" onclick="dlf('milkontrol-report.html',rhtml())">Скачать отчёт (откройте и сохраните как PDF)</button><button class="btn" style="width:100%;margin-bottom:8px" onclick="dlf('milkontrol-data.xlsx',xl())">Скачать Excel с данными</button><button class="btn o" style="width:100%" onclick="$('#md').innerHTML=''">Закрыть</button>`;$('#pgr').previousElementSibling.previousElementSibling.textContent='Отчёт готов'},2100)}
function tc(){const c=$('#chat');if(c.style.display=='block'){c.style.display='none';return}c.style.display='block';cr()}
function cr(){const qs=["Почему упали продажи в Актобе?","Кто не выполняет план?","Где нет ларей?","Какие точки не посещены?"];$('#chat').innerHTML=`<div class="cd" style="box-shadow:0 8px 30px #0004"><b>ИИ-ассистент</b><div style="max-height:260px;overflow:auto;margin:8px 0">${S.chat.map(m=>`<div class="msg ${m.u?'u':''}">${m.t}</div>`).join('')}</div>${qs.map(q=>`<span class="chip" onclick="ask('${q}')">${q}</span>`).join('')}<input id="qi" placeholder="Свой вопрос…" onkeydown="if(event.key=='Enter')ask(this.value)"></div>`}
async function ask(q){if(!q)return;S.chat.push({u:1,t:q});cr();let a=null;const l=P,ac=RP.filter(x=>rs(x.i).pp<70).map(x=>x.n+' ('+rs(x.i).pp+'%)'),ms=l.filter(p=>p.vis>14);
if(/актобе/i.test(q)){const r=rg(P)[4];a=`В Актобе продажи ${pc(r.v)}. Основной вклад даёт торгпред Данияр С. (−30%). Вероятные причины: продукция конкурента, нет заказа или поставки, упал трафик. Рекомендация: визит супервайзера и проверка выкладки.`}
else if(/план/i.test(q))a='Ниже 70% плана: '+(ac.join(', ')||'таких нет')+'. Рекомендация: встреча с торгпредом и разбор маршрута.';
else if(/ларь|ларе/i.test(q))a='Без ларя: '+l.filter(p=>p.fr=='none').map(p=>p.n).join(', ')+'. Ларь без продаж: '+l.filter(p=>p.fr=='idle').map(p=>p.n).join(', ')+'.';
else if(/посещ/i.test(q))a=`Не посещены более 14 дней: ${ms.length} точек (${RG[6][0]}, торгпред Серик А.). Рекомендация: проверить маршрут и причину пропусков.`;
else{try{const sm=await claude.use('sample');if(sm){const r=await sm('Ты ассистент системы Milkontrol для молочной компании. Данные: '+JSON.stringify({регионы:rg(P),ниже_плана:ac,не_посещены:ms.length,без_ларя:l.filter(p=>p.fr!='ok').length})+'\nВопрос: '+q+'\nОтветь по-русски, до 70 слов.');a=r.text}}catch(e){}}
S.chat.push({t:a||'Выберите один из вопросов выше, я отвечу по данным системы.'});cr()}
R();
</script></body></html>
